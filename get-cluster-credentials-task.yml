steps:
  - script: whoami
    displayName: "Show current user"
  - script: id
    displayName: "Show user details"
  - script: sudo -l
    displayName: "Check sudo privileges"
  - task: Kubernetes@1
    inputs:
      connectionType: "Kubernetes Service Connection"
      kubernetesServiceEndpoint: "aks"
      command: "get"
      arguments: "nodes"
  - task: AzureCLI@2
    inputs:
      azureSubscription: "$(subscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing
