steps:
  - script: whoami
    displayName: "Show current user"
  - script: id
    displayName: "Show user details"
  - script: sudo -l
    displayName: "Check sudo privileges"
  # - script: |
  #     az account show
  #     az aks list --resource-group $(ResourceGroup)
  #   displayName: "Validate Azure Subscription and AKS Access"

  - script: |
      echo "Checking Kubernetes Service Connection"
      kubectl config view
      kubectl get nodes
    displayName: "Debug Kubernetes Connection"

  - task: HelmDeploy@1
    inputs:
      connectionType: "Kubernetes Service Connection"
      kubernetesServiceConnection: "aks"
      command: "upgrade"
      chartName: "ingress-nginx/ingress-nginx"
      releaseName: "aks-ingress-nginx"
      install: true
      namespace: "ingress-basic"
      arguments: "--create-namespace"

  - task: Kubernetes@1
    inputs:
      connectionType: "Kubernetes Service Connection"
      kubernetesServiceEndpoint: "aks"
      command: "get"
      arguments: "nodes"

  - task: AzureCLI@2
    inputs:
      azureSubscription: "$(subscription)"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing
